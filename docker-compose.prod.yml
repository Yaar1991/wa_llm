services:
  postgres:
    extends:
      file: docker-compose.base.yml
      service: postgres
    restart: always

  whatsapp:
    extends:
      file: docker-compose.base.yml
      service: whatsapp
    environment:
      - WHATSAPP_WEBHOOK=http://web-server:8000/webhook
    restart: always

  web-server:
    # Built from this fork: the upstream image still uses Anthropic/Voyage.
    build: .
    env_file:
      - .env.prod
    ports:
      - "${WEB_SERVER_HOST_PORT:-47320}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      whatsapp:
        condition: service_started
    environment:
      - PORT=8000
      - DB_URI=postgresql+asyncpg://user:password@postgres:5432/postgres
      - WHATSAPP_HOST=http://whatsapp:3000
      # Ollama runs natively on the Mac host (for GPU access), not in Docker
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

volumes:
  wa_llm_whatsapp:
    name: wa_llm_whatsapp
  wa_llm_postgres:
    name: wa_llm_postgres